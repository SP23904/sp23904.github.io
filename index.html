<style>

.links{display:grid;gap:10px;margin-top:26px}.link{display:flex;align-items:center;gap:15px;text-align:left;padding:17px 18px;text-decoration:none;background:#ffffff04;border:1px solid #ffffff0e;border-radius:13px;transition:background .2s,border-color .2s,transform .2s}.link:hover{background:#e6b7d10b;border-color:#e6b7d144;transform:translateY(-2px)}.link svg{width:22px;height:22px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.5}.link .label{font-size:14px;letter-spacing:.02em;flex:1}.arrow{color:#918996;font-size:20px}.foot{margin:25px 0 0;color:#817985;font:12px monospace;letter-spacing:.07em}.share{position:fixed;bottom:27px;right:30px;width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--border);border-radius:50%;background:#131216;color:#c5bec9;cursor:pointer;transition:border-color .2s}.share:hover{border-color:#e6b7d166}.share svg{width:18px;fill:none;stroke:currentColor;stroke-width:1.5}.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:#242026;border:1px solid var(--border);border-radius:30px;padding:12px 20px;font-size:14px;max-width:calc(100% - 120px);text-align:center}.toast:empty{display:none}
